plugins {
    id "architectury-plugin" version "3.5-SNAPSHOT"
    id "dev.architectury.loom-no-remap" version "1.17-SNAPSHOT" apply false
    id "me.modmuss50.mod-publish-plugin" version "2.1.1"
    id "com.gradleup.shadow" version "9.4.1" apply false
}

architectury {
    minecraft = rootProject.minecraft_version
}

def platforms = enabled_platforms.split(",")
def viewers = ["emi", "rrv"] // синк/порт 26.1.2: jei/rei удалены — политика EMI-only

subprojects {
    apply plugin: "dev.architectury.loom-no-remap"

    dependencies {
        minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    }

    ext {
        expandProps = [
            "mod_id"                    : mod_id,
            "mod_version"               : mod_version,
            "mod_name"                  : mod_name,
            "mod_description"           : mod_description,
            "mod_author"                : mod_author,
            "license"                   : license,
            "java_version"              : java_version,
            "minecraft_version"         : minecraft_version,
            "neoforge_version"             : neoforge_version,
            "neoforge_loader_version_range": neoforge_loader_version_range,
            "neoforge_version_range"       : neoforge_version_range,
            "fabric_loader_version"     : fabric_loader_version,
            "emi_version_range"         : emi_version_range,
            "emi_version_range_fabric"  : emi_version_range_fabric,
            "rrv_version_range"         : rrv_version_range,
            "rrv_version_range_fabric"  : rrv_version_range_fabric,
        ]
    }

    if (platforms.contains(project.name)) {
        def emi_available = emi_enabled == "true" && project.findProperty("${project.name}_emi_enabled") == "true"
        def rrv_available = rrv_enabled == "true" && project.findProperty("${project.name}_rrv_enabled") == "true"

        ext {
            commonProjects = [":common"]
        }

        if (emi_available) project.ext.commonProjects << ":common-emi"
        if (rrv_available) project.ext.commonProjects << ":common-rrv"

        viewers.each { viewer ->
            if (project.findProperty("${viewer}_enabled") == "true" && project.findProperty("${project.name}_${viewer}_enabled") == "true") {
                tasks.register("run${project.name.capitalize()}${viewer.capitalize()}Client", GradleBuild) {
                    group = "launchers"
                    description = "Launch ${project.name.toUpperCase()} with ${viewer.toUpperCase()} recipe viewer"
                    setTasks([":${project.name}:runClient".toString()])
                    startParameter.projectProperties = ["recipe_viewer": viewer]
                }
            }
        }

        dependencies {
            def recipe_viewer = project.findProperty("recipe_viewer")
            if (!recipe_viewer) {
                if (emi_available) recipe_viewer = "emi"
                else if (rrv_available) recipe_viewer = "rrv"
            }

            if (emi_available) {
//                modCompileOnlyApi "dev.emi:emi-${project.name}:${emi_version}"
//                if (recipe_viewer == "emi") {
//                    modRuntimeOnly "dev.emi:emi-${project.name}:${emi_version}"
//                }
                compileOnlyApi "curse.maven:emi-unofficial-port-unstable-1544558:${emi_neoforge}"
                if (recipe_viewer == "emi") {
                     if (project.name == "neoforge") {
                         runtimeOnly "curse.maven:emi-unofficial-port-unstable-1544558:${emi_neoforge}"
                     }
                }
            }
            if (rrv_available) {
                compileOnlyApi "cc.cassian.rrv:reliable-recipe-viewer-${project.name}:${rrv_version}+${minecraft_version}"
                if (recipe_viewer == "rrv") {
                    runtimeOnly "cc.cassian.rrv:reliable-recipe-viewer-${project.name}:${rrv_version}+${minecraft_version}"
                }
            }
        }
    }
}

allprojects {
    apply plugin: "java"
    apply plugin: "architectury-plugin"
    apply plugin: "maven-publish"

    base {
        archivesName = rootProject.archives_base_name + "-" + project.name
    }

    version = rootProject.mod_version
    group = rootProject.maven_group

    repositories {
        exclusiveContent {
            forRepository {
                maven {
                    name = "Cassian's Maven"
                    url = "https://maven.cassian.cc"
                }
            }
            filter {
                includeGroupAndSubgroups("cc.cassian")
            }
        }
        maven {
            name = "Jared's maven"
            url = "https://maven.blamejared.com/"
        }
        maven {
            name = "Gnomecraft Maven"
            url = "https://maven.gnomecraft.net/releases/"
        }
        maven {
            name = "Shedaniel Maven"
            url = "https://maven.shedaniel.me/"
        }
        maven {
            name = "Modrinth"
            url = "https://api.modrinth.com/maven"
        }
        maven {
            name = "CurseMaven"
            url "https://www.cursemaven.com"
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = "UTF-8"
        options.release = Integer.valueOf(rootProject.java_version)
    }

    java {
        withSourcesJar()
    }
}

tasks.publish {
    dependsOn("neoforge:publishMods")
}
